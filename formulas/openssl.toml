# Formula: openssl
# Cryptography and SSL/TLS toolkit

[package]
name = "openssl"
version = "4.0.1"
description = "Cryptography and SSL/TLS toolkit"
homepage = "https://openssl-library.org"
license = "Apache-2.0"

[source]
url = "https://github.com/openssl/openssl/releases/download/openssl-4.0.1/openssl-4.0.1.tar.gz"
sha256 = "2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09"
mirrors = [
    "https://www.openssl.org/source/openssl-4.0.1.tar.gz"
]

[bottle.macos-arm64]
url = "https://github.com/brew-rs/core/releases/download/openssl-4.0.1/openssl-4.0.1.macos-arm64.bottle.tar.gz"
sha256 = "9837b6358bf8d1e4d588b20408fd0f46f4b9f07f889b9c58ae6cb4a9c7eb77c8"

[bottle.macos-x86_64]
url = "https://github.com/brew-rs/core/releases/download/openssl-4.0.1/openssl-4.0.1.macos-x86_64.bottle.tar.gz"
sha256 = "614d0222a540e688b24596f120d7d4b60cf881cdf447f06a2f82e99cd798c9ac"

[bottle.linux-x86_64]
url = "https://github.com/brew-rs/core/releases/download/openssl-4.0.1/openssl-4.0.1.linux-x86_64.bottle.tar.gz"
sha256 = "7cdf2f08957847a75452731d548f21511818b43f90413e5b6dcb29e75fe6ae79"

[dependencies]
runtime = ["zlib"]
build = ["perl", "make"]

[build]
commands = [
    "./Configure --prefix=$PREFIX --openssldir=$PREFIX/etc/openssl --libdir=lib shared zlib",
    "make -j$NCPU",
    "make install"
]

[build.env]
KERNEL_BITS = "64"
