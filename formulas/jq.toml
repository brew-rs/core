# Example formula: jq
# Lightweight and flexible command-line JSON processor

[package]
name = "jq"
version = "1.8.2"
description = "Lightweight and flexible command-line JSON processor"
homepage = "https://jqlang.github.io/jq/"
license = "MIT"

[source]
url = "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-1.8.2.tar.gz"
sha256 = "71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af"

[bottle.macos-arm64]
url = "https://github.com/brew-rs/core/releases/download/jq-1.8.2/jq-1.8.2.macos-arm64.bottle.tar.gz"
sha256 = "db6480c648da7182084800f64a8ead9c2e224a851fe86273a9d1c7d304349210"

[bottle.macos-x86_64]
url = "https://github.com/brew-rs/core/releases/download/jq-1.8.2/jq-1.8.2.macos-x86_64.bottle.tar.gz"
sha256 = "361f271ad632ac722659839d859face905aad012e1c638bf6e8c7eb3f14f8af9"

[bottle.linux-x86_64]
url = "https://github.com/brew-rs/core/releases/download/jq-1.8.2/jq-1.8.2.linux-x86_64.bottle.tar.gz"
sha256 = "8074a66fbd3d271772c330ea97df7f5ccc732ed1bdd148d4a103891010963e90"

[dependencies]
build = ["autoconf", "automake", "libtool"]

[build]
commands = [
    "./configure --prefix=$PREFIX --disable-maintainer-mode --with-oniguruma=builtin",
    "make -j$NCPU",
    "make install"
]
