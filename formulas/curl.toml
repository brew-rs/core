# Example formula: curl
# A command-line tool for transferring data with URLs

[package]
name = "curl"
version = "8.21.0"
description = "Command-line tool for transferring data with URLs"
homepage = "https://curl.se"
license = "MIT"

[source]
url = "https://github.com/curl/curl/releases/download/curl-8_21_0/curl-8.21.0.tar.gz"
sha256 = "d9b327997999045a24cda50f3983e69e51c516bd8be6ef9842fc7f99135e33bb"
mirrors = [
    "https://github.com/curl/curl/releases/download/curl-8_19_0/curl-8.21.0.tar.gz"
]

[bottle.macos-arm64]
url = "https://github.com/brew-rs/core/releases/download/curl-8.21.0/curl-8.21.0.macos-arm64.bottle.tar.gz"
sha256 = "fc1cac2837f55f68359a5e96e6ab0158eacc353cf16f5609970edb0e29890a85"

[bottle.macos-x86_64]
url = "https://github.com/brew-rs/core/releases/download/curl-8.21.0/curl-8.21.0.macos-x86_64.bottle.tar.gz"
sha256 = "afbdae7421d608f8f22def4644d424d28205a13a7c2df037c6d45bd355573735"

[bottle.linux-x86_64]
url = "https://github.com/brew-rs/core/releases/download/curl-8.21.0/curl-8.21.0.linux-x86_64.bottle.tar.gz"
sha256 = "9ea65449c82baf50629dba79e205d857de037d8703f9b98cb594e4185560cfc5"

[dependencies]
runtime = ["openssl ^3.0", "zlib >=1.2.11", "libssh2"]
build = ["pkg-config", "autoconf", "automake"]

[build]
commands = [
    "./configure --prefix=$PREFIX --with-openssl --with-libssh2 --with-zlib --without-libpsl --without-brotli --without-zstd --without-nghttp2 --without-libidn2 --disable-ldap --disable-ldaps",
    "make -j$NCPU",
    "make install"
]
